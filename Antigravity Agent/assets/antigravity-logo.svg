<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="core-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with subtle cosmic border -->
  <circle cx="64" cy="64" r="60" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="2" />

  <!-- Outer Orbital Ring (Antigravity Field) -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#orbit-grad)" stroke-width="4.5" stroke-dasharray="210 30" transform="rotate(-35 64 64)" filter="url(#neon-glow)" />

  <!-- Inner Inverted Gravity Core (Upward Levitation & Power Glyph) -->
  <!-- Floating Diamond / Levitation Geometry -->
  <path d="M 64 24 L 84 58 L 64 50 L 44 58 Z" fill="url(#core-grad)" filter="url(#neon-glow)" />
  <path d="M 64 54 L 80 84 L 64 78 L 48 84 Z" fill="url(#orbit-grad)" opacity="0.9" />

  <!-- Quantum Singularity Dots -->
  <circle cx="64" cy="98" r="4.5" fill="#00F2FE" filter="url(#neon-glow)" />
  <circle cx="28" cy="46" r="2.5" fill="#8B5CF6" opacity="0.8" />
  <circle cx="100" cy="80" r="2.5" fill="#00F2FE" opacity="0.8" />
</svg>
