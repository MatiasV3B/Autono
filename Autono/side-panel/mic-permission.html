<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autono — Microphone</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f1115; color: #f4f4f5; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { max-width: 420px; padding: 28px; text-align: center; }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { color: #a1a1aa; line-height: 1.5; margin: 0 0 18px; }
    button { background: #38bdf8; color: #06202e; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; padding: 10px 18px; cursor: pointer; }
    #status { margin-top: 16px; font-size: 14px; }
    .ok { color: #4ade80; } .bad { color: #f87171; }
  </style>
</head>
<body>
  <main>
    <h1>Allow the microphone for Autono</h1>
    <p>Autono uses your microphone only when you press the mic button to dictate. Chrome asks once here and remembers your choice.</p>
    <button id="allow" type="button">Allow microphone</button>
    <div id="status" role="status"></div>
  </main>
  <script src="mic-permission.js"></script>
</body>
</html>
